<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Imperial Judicial Slate -->
    <radialGradient id="courtBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D1B4E" />
      <stop offset="70%" stop-color="#140E26" />
      <stop offset="100%" stop-color="#0A0714" />
    </radialGradient>

    <!-- Metallic Gold Gradient for Scales & Trim -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#F5D76E" />
    </linearGradient>

    <!-- Subtle Violet Glow -->
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left: 100x100 box, centered at x=60, y=60) -->
  <g transform="translate(10, 10)">
    <!-- Container Squircle / Judicial Plaque -->
    <rect width="100" height="100" rx="22" fill="url(#courtBg)" />
    <rect width="98" height="98" x="1" y="1" rx="21" stroke="url(#goldGradient)" stroke-width="1.2" stroke-opacity="0.4" />
    <rect width="92" height="92" x="4" y="4" rx="18" stroke="#9333EA" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Background Arch Silhouette -->
    <path d="M 22 84 V 42 A 28 28 0 0 1 78 42 V 84 Z" fill="url(#violetGlow)" />
    <path d="M 26 83 V 43 A 24 24 0 0 1 74 43 V 83" stroke="url(#goldGradient)" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="2 2" />

    <!-- Soundwave Voice Resonance Bars -->
    <g opacity="0.85" filter="url(#shadow)">
      <rect x="34" y="44" width="2" height="14" rx="1" fill="url(#goldGradient)" opacity="0.5" />
      <rect x="39" y="39" width="2" height="24" rx="1" fill="url(#goldGradient)" opacity="0.75" />
      <rect x="44" y="34" width="2" height="34" rx="1" fill="url(#goldGradient)" opacity="0.95" />
      <rect x="54" y="34" width="2" height="34" rx="1" fill="url(#goldGradient)" opacity="0.95" />
      <rect x="59" y="39" width="2" height="24" rx="1" fill="url(#goldGradient)" opacity="0.75" />
      <rect x="64" y="44" width="2" height="14" rx="1" fill="url(#goldGradient)" opacity="0.5" />
    </g>

    <!-- Central Judicial Pillar / Sceptre -->
    <!-- Base Pedestal -->
    <path d="M 40 80 H 60 V 78 C 60 76.5 58 76 56 76 H 44 C 42 76 40 76.5 40 78 Z" fill="url(#goldGradient)" filter="url(#shadow)" />
    <!-- Main Pillar Spine -->
    <rect x="49" y="26" width="2.2" height="52" rx="1.1" fill="url(#goldGradient)" />

    <!-- Finial Star -->
    <path d="M 50 14 L 51.5 18 L 56 18.5 L 52.5 21.5 L 53.5 26 L 50 23.5 L 46.5 26 L 47.5 21.5 L 44 18.5 L 48.5 18 Z" fill="url(#goldGradient)" filter="url(#shadow)" />

    <!-- Scales Crossbeam (Meezan Arch) -->
    <path d="M 24 38 C 36 34.5 45 29 50 29 C 55 29 64 34.5 76 38" stroke="url(#goldGradient)" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#shadow)" />
    <circle cx="50" cy="29" r="2.5" fill="#140E26" stroke="url(#goldGradient)" stroke-width="1.5" />
    <circle cx="24" cy="38" r="1.8" fill="url(#goldGradient)" />
    <circle cx="76" cy="38" r="1.8" fill="url(#goldGradient)" />

    <!-- Left Scale Pan & Strings -->
    <g filter="url(#shadow)">
      <line x1="24" y1="38" x2="16" y2="60" stroke="url(#goldGradient)" stroke-width="0.9" stroke-opacity="0.8" />
      <line x1="24" y1="38" x2="32" y2="60" stroke="url(#goldGradient)" stroke-width="0.9" stroke-opacity="0.8" />
      <path d="M 14 60 C 14 68 34 68 34 60 Z" fill="url(#goldGradient)" />
      <line x1="13" y1="60" x2="35" y2="60" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Right Scale Pan & Strings -->
    <g filter="url(#shadow)">
      <line x1="76" y1="38" x2="68" y2="60" stroke="url(#goldGradient)" stroke-width="0.9" stroke-opacity="0.8" />
      <line x1="76" y1="38" x2="84" y2="60" stroke="url(#goldGradient)" stroke-width="0.9" stroke-opacity="0.8" />
      <path d="M 66 60 C 66 68 86 68 86 60 Z" fill="url(#goldGradient)" />
      <line x1="65" y1="60" x2="87" y2="60" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Right) -->
  <g transform="translate(130, 0)">
    <!-- Brand Title: Newsreader Serif Aesthetic -->
    <text x="0" y="58" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="34" font-weight="500" letter-spacing="-0.02em" fill="#F8FAFC">
      CourtSimulator
    </text>

    <!-- Subtitle Badge & Apparatus Line -->
    <text x="0" y="82" font-family="'Courier Prime', monospace" font-size="11" font-weight="400" letter-spacing="0.14em" fill="#D4AF37">
      ADALAT AI · عدل
    </text>

    <text x="130" y="82" font-family="'Archivo', sans-serif" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#94A3B8">
      Pakistan Superior Judiciary Moot Chamber
    </text>

    <!-- Decorative Gold Accent Line -->
    <rect x="0" y="93" width="320" height="1" fill="url(#goldGradient)" opacity="0.3" />
    <circle cx="0" cy="93.5" r="1.5" fill="#D4AF37" />
  </g>
</svg>
